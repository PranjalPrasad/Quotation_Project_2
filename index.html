<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - VKM CRM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- base & reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        :root {
            --brand-darkest: #800021;
            --brand-dark: #881144;
            --brand-mid: #C23666;
            --brand-light: #FF69B4;
            --brand-bg: #FDEEF3;
            --brand-border: #F0C3D6;
            --brand-icon: #D98CAE;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--brand-bg);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            width: 100%;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 20px 40px -12px rgba(128, 0, 33, 0.25);
            border: 1.5px solid var(--brand-border);
        }

        /* --- left side (brand) --- */
        .brand-side {
            flex: 1;
            background: linear-gradient(160deg, var(--brand-darkest) 0%, var(--brand-dark) 45%, var(--brand-mid) 100%);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            position: relative;
            overflow: hidden;
            min-height: 480px;
        }

        .brand-side::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(255, 105, 180, 0.25) 0%, rgba(128, 0, 33, 0.1) 45%, rgba(128, 0, 33, 0.65) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .brand-logo-side {
            position: relative;
            z-index: 1;
            width: 76px;
            height: 76px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 22px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.35);
            flex-shrink: 0;
        }

        .brand-logo-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-content {
            position: relative;
            z-index: 1;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .brand-title {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .brand-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            line-height: 1.6;
            max-width: 260px;
        }

        /* --- right side (form) --- */
        .form-side {
            flex: 1;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
            min-width: 0;
        }

        .form-side h2 {
            color: var(--brand-darkest);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-side .welcome-text {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 500;
            color: #374151;
        }

        .form-group label i {
            margin-right: 6px;
            color: var(--brand-dark);
            font-size: 11px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--brand-icon);
            font-size: 13px;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border: 1.5px solid var(--brand-border);
            border-radius: 10px;
            font-size: 13px;
            transition: all 0.3s ease;
            font-family: 'Roboto', sans-serif;
            background: #fff;
            color: #1F2937;
            /* 16px minimum prevents iOS Safari from auto-zooming the page on input focus */
            font-size: 16px;
        }

        @media (min-width: 481px) {
            .form-control {
                font-size: 13px;
            }
        }

        .form-control:hover {
            border-color: var(--brand-icon);
            box-shadow: 0 2px 6px rgba(128, 0, 33, 0.1);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--brand-darkest);
            box-shadow: 0 0 0 2px rgba(194, 54, 102, 0.2);
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--brand-icon);
            font-size: 13px;
            padding: 8px;
            margin: -8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: var(--brand-darkest);
        }

        .form-options {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #6b7280;
            cursor: pointer;
        }

        .checkbox-label input {
            width: 14px;
            height: 14px;
            cursor: pointer;
            accent-color: var(--brand-darkest);
            flex-shrink: 0;
        }

        .btn-primary {
            width: 100%;
            padding: 11px;
            background: var(--brand-darkest);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary:hover {
            background: var(--brand-dark);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: scale(0.97);
            transition: transform 0.1s ease;
        }

        .btn-primary:not(.loading):active {
            animation: btnBounce 0.35s ease;
        }

        @keyframes btnBounce {
            0% { transform: scale(0.97); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .alert {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-error {
            background: #FFE4E6;
            color: #9F1239;
            border: 1px solid #FBCFE0;
        }

        .alert i {
            font-size: 12px;
        }

        .btn-primary.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-primary.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .footer-copyright {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: #9CA3AF;
            letter-spacing: 0.2px;
        }

        .footer-copyright span {
            color: var(--brand-dark);
            font-weight: 500;
        }

        /* ============================================================
           RESPONSIVE BREAKPOINTS
           Large desktop -> laptop -> tablet landscape -> tablet portrait
           -> large phone -> small phone -> very small phone
           ============================================================ */

        /* --- large desktop / big monitors --- */
        @media (min-width: 1400px) {
            .login-card {
                max-width: 980px;
            }

            .brand-title {
                font-size: 28px;
            }
        }

        /* --- laptop / small desktop --- */
        @media (max-width: 1199px) {
            .login-card {
                max-width: 820px;
            }
        }

        /* --- tablet landscape --- */
        @media (max-width: 991px) {
            .login-card {
                max-width: 640px;
            }

            .brand-side {
                padding: 32px 24px;
                min-height: 440px;
            }
        }

        /* --- tablet portrait: stack to single column --- */
        @media (max-width: 768px) {
            .login-container {
                padding: 16px;
            }

            .login-card {
                flex-direction: column;
                max-width: 440px;
                border-radius: 18px;
            }

            .brand-side {
                min-height: 200px;
                padding: 24px;
                justify-content: flex-end;
            }

            .brand-logo-side {
                width: 60px;
                height: 60px;
                margin-bottom: 16px;
            }

            .brand-title {
                font-size: 20px;
            }

            .brand-subtitle {
                font-size: 12px;
                max-width: 100%;
            }

            .form-side {
                padding: 30px 28px;
            }
        }

        /* --- large phones (landscape phones / small tablets) --- */
        @media (max-width: 600px) {
            .login-card {
                max-width: 420px;
                border-radius: 16px;
            }

            .form-side {
                padding: 28px 24px;
            }

            .form-side h2 {
                font-size: 21px;
            }
        }

        /* --- standard phones --- */
        @media (max-width: 480px) {
            .login-container {
                padding: 12px;
            }

            .login-card {
                border-radius: 14px;
                max-width: 100%;
            }

            .brand-side {
                min-height: 160px;
                padding: 20px;
            }

            .brand-logo-side {
                width: 52px;
                height: 52px;
                border-radius: 14px;
                margin-bottom: 12px;
            }

            .brand-badge {
                font-size: 10px;
                padding: 4px 10px;
            }

            .brand-title {
                font-size: 19px;
                margin-bottom: 6px;
            }

            .brand-subtitle {
                font-size: 11.5px;
                line-height: 1.5;
            }

            .form-side {
                padding: 24px 20px;
            }

            .form-side h2 {
                font-size: 20px;
            }

            .welcome-text {
                margin-bottom: 22px;
            }

            .form-group {
                margin-bottom: 16px;
            }

            .btn-primary {
                padding: 12px;
                font-size: 14px;
            }
        }

        /* --- small phones (iPhone SE, older Android, etc.) --- */
        @media (max-width: 375px) {
            .login-container {
                padding: 8px;
            }

            .login-card {
                border-radius: 12px;
            }

            .brand-side {
                min-height: 140px;
                padding: 16px;
            }

            .brand-logo-side {
                width: 46px;
                height: 46px;
                margin-bottom: 10px;
            }

            .brand-title {
                font-size: 17px;
            }

            .brand-subtitle {
                font-size: 11px;
            }

            .form-side {
                padding: 20px 16px;
            }

            .form-side h2 {
                font-size: 18px;
            }

            .form-control {
                padding: 9px 10px 9px 34px;
            }

            .input-wrapper i,
            .password-wrapper i.fa-lock {
                left: 10px;
            }

            .password-toggle {
                right: 10px;
            }
        }

        /* --- very small / narrow phones --- */
        @media (max-width: 320px) {
            .brand-side {
                min-height: 120px;
            }

            .brand-content .brand-badge {
                display: none;
            }

            .form-side {
                padding: 18px 14px;
            }
        }

        /* --- short viewports / landscape phones: prioritize the form,
               shrink or hide the brand panel so the login form + button
               stay reachable without scrolling --- */
        @media (max-height: 560px) and (max-width: 900px) {
            .login-container {
                padding: 10px;
            }

            .login-card {
                flex-direction: row;
            }

            .brand-side {
                min-height: 0;
                padding: 20px;
                flex: 0 0 38%;
            }

            .brand-subtitle {
                display: none;
            }

            .form-side {
                padding: 20px 24px;
                justify-content: center;
            }

            .form-group {
                margin-bottom: 12px;
            }

            .form-options {
                margin-bottom: 14px;
            }
        }

        @media (max-height: 420px) {
            .brand-side {
                display: none;
            }

            .login-card {
                max-width: 480px;
            }
        }

        /* --- touch devices: bigger tap targets --- */
        @media (hover: none) and (pointer: coarse) {
            .checkbox-label input {
                width: 18px;
                height: 18px;
            }

            .password-toggle {
                font-size: 15px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes progressShrink {
            from { width: 100%; }
            to { width: 0%; }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">

            <!-- Left Side – Brand Panel -->
            <div class="brand-side">
                <div class="brand-logo-side">
                    <img src="/img/image.png" alt="VKM Logo"></div>
                <div class="brand-content">
                    <div class="brand-badge">
                        <i class="fas fa-shield-heart"></i> VKM CRM
                    </div>
                    <div class="brand-title">Welcome to VKM</div>
                    <div class="brand-subtitle">
                        Manage your entire operation—from one unified, secure dashboard.
                    </div>
                </div>
            </div>

            <!-- Right Side - Login Form -->
            <div class="form-side">
                <h2>Welcome Back</h2>
                <div class="welcome-text">Please login to your admin account</div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i> Email Address
                        </label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="text" id="email" class="form-control" required placeholder="Admin"
                                value="admin@gmail.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <div class="password-wrapper">
                            <i class="fas fa-lock" style="left:12px;position:absolute;top:50%;transform:translateY(-50%);z-index:1;color:var(--brand-icon);font-size:13px;"></i>
                            <input type="password" id="password" class="form-control" required
                                placeholder="Enter your password" style="padding-right: 38px;" value="admin@1234">
                            <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <i class="fas fa-check-circle"></i> Remember me
                        </label>
                    </div>

                    <div id="loginError" class="alert alert-error" style="display: none;">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span id="errorMessage"></span>
                    </div>

                    <button type="submit" class="btn-primary" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                    </button>
                </form>

                <div class="footer-copyright">
                    &copy; 2026 <span>Kunash Media Solutions</span>. All rights reserved.
                </div>
            </div>

        </div>
    </div>

    <!-- auth.js must load BEFORE the inline script below, since that script calls Auth.login() -->
    <script src="./auth.js"></script>
    <script>
        // If the admin is already logged in, skip the login form entirely.
        // Runs on pageshow (not just once at parse time) because the browser
        // Back/Forward buttons often restore this page from bfcache — in that
        // case NO scripts re-execute, so a plain top-level check here would
        // silently do nothing when the user hits Back from the dashboard.
        // event.persisted === true means "this was a bfcache restore".
        window.addEventListener('pageshow', function () {
            if (Auth.isAuthenticated()) {
                window.location.replace('./dashboard/dashboard.html');
            }
        });
    </script>
    <script>
        // ---- DOM refs ----
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberCheckbox = document.getElementById('rememberMe');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const errorMessage = document.getElementById('errorMessage');
        const togglePassword = document.getElementById('togglePassword');

        // ---- remember me prefill ----
        if (localStorage.getItem('rememberedEmail')) {
            emailInput.value = localStorage.getItem('rememberedEmail');
            rememberCheckbox.checked = true;
        }

        // ---- password toggle ----
        togglePassword.addEventListener('click', function() {
            const input = passwordInput;
            input.type = input.type === 'password' ? 'text' : 'password';
            this.classList.toggle('fa-eye-slash');
        });

        // ---- show login error helper ----
        function showLoginError(msg) {
            errorMessage.textContent = msg;
            loginError.style.display = 'flex';
            setTimeout(() => { loginError.style.display = 'none'; }, 4000);
        }

        // ---- overlay message (success / error) ----
        function showOverlayMessage(message, type) {
            const existing = document.querySelector('.message-overlay');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.className = 'message-overlay';
            overlay.style.cssText = `
                    position: fixed; top:0; left:0; width:100%; height:100%;
                    background: rgba(128,0,33,0.55); backdrop-filter: blur(4px);
                    display: flex; align-items: center; justify-content: center;
                    z-index: 9999; animation: fadeIn 0.3s ease;
                    font-family: 'Roboto', sans-serif;
                    padding: 16px;
                `;

            if (type === 'success') {
                overlay.innerHTML = `
                        <div class="message-card success-card" style="background:white; border-radius:16px; padding:32px 40px; max-width:400px; width:90%; text-align:center; animation:slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 20px 40px rgba(128,0,33,0.3); border-top:4px solid #047857;">
                            <div style="width:70px; height:70px; border-radius:50%; background:#D1FAE5; color:#047857; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:32px;">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <h3 style="font-size:20px; font-weight:700; margin-bottom:12px; color:#800021;">Authentication Successful</h3>
                            <p style="font-size:13px; color:#6b7280; line-height:1.5; margin-bottom:20px;">Welcome back, Administrator! You have successfully logged into VKM CRM.</p>
                            <div style="font-size:11px; color:#9CA3AF; display:flex; align-items:center; justify-content:center; gap:6px; margin-top:16px; padding-top:16px; border-top:1px solid #F0C3D6;">
                                <i class="fas fa-clock"></i> Redirecting to dashboard...
                            </div>
                            <div style="width:100%; height:3px; background:#F0C3D6; border-radius:3px; overflow:hidden; margin-top:20px;">
                                <div style="width:100%; height:100%; background:#047857; animation: progressShrink 1.5s linear forwards;"></div>
                            </div>
                        </div>
                    `;
            } else {
                const safeMessage = message || 'The email address or password you entered is incorrect. Please verify your credentials and try again.';
                overlay.innerHTML = `
                        <div class="message-card error-card" style="background:white; border-radius:16px; padding:32px 40px; max-width:400px; width:90%; text-align:center; animation:slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 20px 40px rgba(128,0,33,0.3); border-top:4px solid #E11D48;">
                            <div style="width:70px; height:70px; border-radius:50%; background:#FFE4E6; color:#E11D48; display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:32px;">
                                <i class="fas fa-lock"></i>
                            </div>
                            <h3 style="font-size:20px; font-weight:700; margin-bottom:12px; color:#800021;">Authentication Failed</h3>
                            <p style="font-size:13px; color:#6b7280; line-height:1.5; margin-bottom:20px;">${safeMessage}</p>
                            <div style="background:#FEF3C7; border-radius:8px; padding:12px; margin:16px 0; text-align:left; font-size:11px; color:#B45309;">
                                <div style="margin:6px 0; display:flex; gap:8px;"><i class="fas fa-envelope"></i> Use registered admin email</div>
                                <div style="margin:6px 0; display:flex; gap:8px;"><i class="fas fa-key"></i> Check for case-sensitive password</div>
                            </div>
                            <div style="font-size:11px; color:#9CA3AF; display:flex; align-items:center; justify-content:center; gap:6px; margin-top:16px; padding-top:16px; border-top:1px solid #F0C3D6;">
                                <i class="fas fa-exclamation-triangle"></i> Attempt remaining: Unlimited
                            </div>
                            <button id="tryAgainBtn" style="background:#800021; color:white; border:none; padding:8px 20px; border-radius:8px; font-size:12px; font-weight:500; cursor:pointer; margin-top:16px; transition:all 0.2s;">Try Again</button>
                        </div>
                    `;
            }

            document.body.appendChild(overlay);

            if (type === 'success') {
                setTimeout(() => {
                    overlay.style.animation = 'fadeOut 0.3s ease';
                    setTimeout(() => overlay.remove(), 300);
                }, 3000);
            } else {
                const tryBtn = overlay.querySelector('#tryAgainBtn');
                if (tryBtn) {
                    tryBtn.onmouseover = () => tryBtn.style.background = '#881144';
                    tryBtn.onmouseout = () => tryBtn.style.background = '#800021';
                    tryBtn.onclick = () => overlay.remove();
                }
            }
        }

        // ---- LOGIN submit ----
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showLoginError('Please enter both email and password');
                return;
            }

            loginBtn.classList.add('loading');
            loginBtn.innerHTML = '<i class="fas fa-spinner"></i> Logging in...';
            loginError.style.display = 'none';

            const result = await Auth.login(email, password, rememberCheckbox.checked);

            if (result.success) {
                showOverlayMessage('', 'success');
                setTimeout(() => {
                    window.location.href = './dashboard/dashboard.html';
                }, 5000);
            } else {
                showOverlayMessage(result.message || '', 'error');
                loginBtn.classList.remove('loading');
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
                passwordInput.value = '';
            }
        });

        console.log('VKM CRM login ready.');
    </script>
</body>

</html>
